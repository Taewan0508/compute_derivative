name: Daily Kalshi Compute Tracker

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows manual triggering from the GitHub Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write  # Grants permission to commit the updated CSV back to the repo

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run compute tracker
        run: python compute_tracker.py

      - name: Commit and push CSV update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add compute_prices_history.csv
          
          # Only commit if the CSV actually changed to avoid job failures
          git diff --staged --quiet || git commit -m "chore: auto-update compute price history [skip ci]"
          git push
